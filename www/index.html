<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="refresh" content="3; url=https://CHANGE-ME.example.com" />
  <title>THE SHIVA</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      color: #e6e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: 4px; color: #c8a96e; }
    .tag { margin-top: 8px; font-size: 13px; color: #94a3b8; }
    .spinner {
      margin-top: 28px; width: 34px; height: 34px;
      border: 3px solid rgba(200, 169, 110, 0.25);
      border-top-color: #c8a96e; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { margin-top: 24px; font-size: 12px; color: #64748b; max-width: 320px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="logo">THE SHIVA</div>
  <div class="tag">Learn. Practice. Conquer.</div>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <p class="hint">Connecting to the THE SHIVA platform&hellip;</p>
</body>
</html>
